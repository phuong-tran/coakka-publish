name: HTTP Runtime benchmark evidence

on:
  pull_request:
    paths:
      - coakka-http-runtime/benchmark/**
      - .github/workflows/benchmark-evidence.yml
  push:
    branches: [main]
    paths:
      - coakka-http-runtime/benchmark/**
      - .github/workflows/benchmark-evidence.yml

permissions:
  contents: read

jobs:
  benchmark-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: coakka-http-runtime/benchmark
      - run: |
          python3 -B coakka-http-runtime/benchmark/verify-evidence.py
          python3 -B coakka-http-runtime/benchmark/test-verify-evidence.py
