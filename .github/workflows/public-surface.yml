name: public-surface

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-native-runtime:
    name: HTTP native runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: windows-latest
            platform: windows-x86_64
    steps:
      - name: Check out artifacts
        uses: actions/checkout@v6

      - name: Admit and extract the exact native package
        shell: bash
        run: |
          bash scripts/verify-http-runtime-release.sh --candidate
          bash scripts/verify-http-runtime-test-source.sh
          mkdir -p build/http-package
          tar -xzf coakka-http-runtime/native/candidates/2026-10-08-r3/coakka-http-native-1.0.0-candidate-${{ matrix.platform }}.tar.gz -C build/http-package

      - name: Configure public ABI test
        run: >-
          cmake
          -S coakka-http-runtime/runtime-test
          -B build/coakka-http-runtime-test
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/http-package
          -DCOAKKA_HTTP_RUNTIME_TEST_EXPECT_TLS=ON
          -DCOAKKA_HTTP_RUNTIME_TEST_EXPECT_OUTBOUND=ON

      - name: Build public ABI test
        run: cmake --build build/coakka-http-runtime-test --config Release --parallel

      - name: Run public ABI test
        run: >-
          ctest
          --test-dir build/coakka-http-runtime-test
          -C Release
          --repeat until-fail:20
          --output-on-failure

  http-native-sanitizers:
    name: HTTP consumer ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: ASan
            flag: address
          - sanitizer: UBSan
            flag: undefined
          - sanitizer: TSan
            flag: thread
    steps:
      - name: Check out artifacts
        uses: actions/checkout@v6

      - name: Admit and extract the exact native package
        shell: bash
        run: |
          bash scripts/verify-http-runtime-release.sh --candidate
          bash scripts/verify-http-runtime-test-source.sh
          mkdir -p build/http-package
          tar -xzf coakka-http-runtime/native/candidates/2026-10-08-r3/coakka-http-native-1.0.0-candidate-linux-x86_64.tar.gz -C build/http-package

      - name: Configure instrumented public ABI test
        run: >-
          cmake
          -S coakka-http-runtime/runtime-test
          -B build/coakka-http-runtime-${{ matrix.sanitizer }}
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/http-package
          -DCOAKKA_HTTP_RUNTIME_TEST_EXPECT_OUTBOUND=ON
          "-DCMAKE_C_FLAGS=-fsanitize=${{ matrix.flag }} -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=${{ matrix.flag }} -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=${{ matrix.flag }}

      - name: Build instrumented public ABI test
        run: >-
          cmake
          --build build/coakka-http-runtime-${{ matrix.sanitizer }}
          --parallel

      - name: Run instrumented public ABI test
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:ignore_noninstrumented_modules=1
        run: >-
          ctest
          --test-dir build/coakka-http-runtime-${{ matrix.sanitizer }}
          --output-on-failure

  verify:
    name: verify public artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out artifacts
        uses: actions/checkout@v6

      - name: Verify public surface
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/coakka-pycache
        run: |
          bash -n \
            scripts/scan-public-surface.sh \
            scripts/test-public-surface-scanner.sh \
            scripts/test-public-artifact-manifest.sh \
            scripts/test-npm-package-manager-artifact.sh \
            scripts/test-npm-package-manager-candidates.sh \
            scripts/publish-npm-package-manager-candidates.sh \
            scripts/verify-npm-registry-candidates.sh \
            scripts/test-runtime-intake-artifact.sh \
            scripts/test-runtime-addon-release.sh \
            scripts/verify-http-runtime-release.sh \
            scripts/verify-http-runtime-test-source.sh \
            scripts/verify-public-surface.sh
          python3 -m py_compile scripts/verify-runtime-intake-artifact.py
          python3 -m py_compile scripts/verify-runtime-addon-release.py
          python3 -m py_compile scripts/verify-npm-package-manager-artifact.py
          python3 -m py_compile scripts/package-artifact-source-release.py
          python3 -m py_compile scripts/test-package-artifact-source-sanitization.py
          python3 scripts/test-package-artifact-source-sanitization.py
          scripts/test-public-surface-scanner.sh
          scripts/test-public-artifact-manifest.sh
          scripts/test-npm-package-manager-artifact.sh
          scripts/test-npm-package-manager-candidates.sh
          scripts/test-runtime-intake-artifact.sh
          scripts/test-runtime-addon-release.sh
          python3 scripts/test-http-runtime-release.py
          python3 scripts/test-http-inspect-candidate.py
          scripts/verify-http-runtime-release.sh --all-candidates
          scripts/verify-http-runtime-test-source.sh
          scripts/verify-public-surface.sh
