name: public-surface

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify public artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out artifacts
        uses: actions/checkout@v6

      - name: Verify public surface
        run: |
          bash -n \
            scripts/scan-public-surface.sh \
            scripts/test-public-surface-scanner.sh \
            scripts/test-public-artifact-manifest.sh \
            scripts/test-npm-package-manager-artifact.sh \
            scripts/test-npm-package-manager-candidates.sh \
            scripts/publish-npm-package-manager-candidates.sh \
            scripts/verify-npm-registry-candidates.sh \
            scripts/test-runtime-intake-artifact.sh \
            scripts/verify-public-surface.sh
          python3 -m py_compile scripts/verify-runtime-intake-artifact.py
          python3 -m py_compile scripts/verify-npm-package-manager-artifact.py
          scripts/test-public-surface-scanner.sh
          scripts/test-public-artifact-manifest.sh
          scripts/test-npm-package-manager-artifact.sh
          scripts/test-npm-package-manager-candidates.sh
          scripts/test-runtime-intake-artifact.sh
          scripts/verify-public-surface.sh

  runtime-test-sanitizers:
    name: runtime test / linux ASan+UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out artifacts
        uses: actions/checkout@v6

      - name: Build and run the auditable native harness
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          package_dir="${RUNNER_TEMP}/coakka-runtime-native"
          build_dir="${RUNNER_TEMP}/coakka-runtime-test"
          mkdir -p "${package_dir}"
          tar -C "${package_dir}" -xzf \
            runtime/native/releases/1.3.4+dc6ec284/coakka-runtime-native-v2-1.3.4.tar.gz
          package_root="${package_dir}/coakka-runtime-native-v2-1.3.4"
          CLANG=clang bash runtime-test/analyze.sh "${package_root}/include"
          cmake -S runtime-test -B "${build_dir}" \
            -DCMAKE_PREFIX_PATH="${package_root}" \
            -DCOAKKA_NATIVE_EVIDENCE_ENABLE_SANITIZERS=ON
          cmake --build "${build_dir}" --config Release
          LD_LIBRARY_PATH="${package_root}/native/linux-x86_64" \
            "${build_dir}/coakka_runtime_v2_native_evidence" smoke --requests 32
